name: CI

on:
  push:
    branches: [vobiz-jssip]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]  # maintained Node lines; 26 is active LTS
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check both bundles
        run: |
          node --check dist/vobiz-jssip.js
          node --check dist/vobiz-jssip.min.js
      - name: Unit tests (both bundles)
        run: npm test

  package:
    name: package contents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Only dist, typings, licence and README are published
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path).sort();
            const allowed = /^(dist\/vobiz-jssip(\.min)?\.js|index\.d\.ts|LICENSE|README\.md|package\.json)$/;
            const bad = files.filter((f) => !allowed.test(f));
            console.log(files.join("\n"));
            if (bad.length) { console.error("unexpected files in package:", bad); process.exit(1); }
          '
      - name: No upstream vendor names or secrets in the published files
        run: |
          if grep -n -i -E 'plivo|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY' dist/*.js index.d.ts README.md package.json; then
            echo "found a forbidden string"; exit 1
          fi
