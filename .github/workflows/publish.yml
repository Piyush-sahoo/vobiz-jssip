name: Publish to npm

# Runs when a GitHub release is published (tag vX.Y.Z matching package.json).
# Uses npm trusted publishing (OIDC): no npm token is stored in GitHub. The package's
# trusted publisher on npmjs.com must point at vobiz-ai/vobiz-jssip, workflow publish.yml,
# environment npm. Provenance is attached automatically.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and validate only, do not publish'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing support (>= 11.5.1)
        run: npm install -g npm@^11.15.0 && npm --version
      - name: Tag matches package.json version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "release tag $TAG does not match package.json version v$VERSION"; exit 1
          fi
      - name: Version not already on npm
        run: |
          NAME="$(node -p 'require("./package.json").name')"
          VERSION="$(node -p 'require("./package.json").version')"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published"; exit 1
          fi
      - name: Test
        run: |
          node --check dist/vobiz-jssip.js
          node --check dist/vobiz-jssip.min.js
          npm test
      - name: Pack (dry run)
        run: npm pack --dry-run
      - name: Publish
        if: github.event_name == 'release' || inputs.dry_run == false
        run: npm publish --access public
